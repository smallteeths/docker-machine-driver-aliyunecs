name: Build and Release Pipeline

on:
  push:
    branches:
      - main
      - "release/v*.**"
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.19
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Run Go Mod Tidy
        run: |
          go mod tidy

      - name: Run Build
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DRONE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/entry ci

      - name: Debug Output
        run: |
          ls -la dist || echo "dist folder not found"
          ls -la bin || echo "bin folder not found"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            bin/

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./output

      - name: Prepare Release Files
        run: |
          mkdir -p dist bin
          mv output/dist/* dist/ || echo "No dist files found"
          mv output/bin/* bin/ || echo "No bin files found"
          ls -la dist
          ls -la bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            bin/*
          generate_release_notes: true
